name: Deploy

# Push to master -> SSH into the VPS -> it pulls the commit, BUILDS the image
# there, and swaps containers with a health gate and automatic rollback.
# Nothing is built on GitHub; this job is a trigger and a status light.

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# One deploy at a time, never cancelled midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build on VPS and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Build and deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd /opt/revtype
            # The repo is the source of truth for every deploy file. .env,
            # .deploy-state and the Docker caches are untracked and untouched.
            git fetch --quiet origin
            git reset --quiet --hard "${{ github.sha }}"
            # bash rather than ./ : immune to the executable bit, which a
            # commit from Windows can silently drop.
            bash ./deploy.sh

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### OK - deployed ${{ github.sha }} (built on the VPS)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### FAILED - previous release still serving (auto-revert)" >> "$GITHUB_STEP_SUMMARY"
          fi
